## Profile DEV — chỉ dùng để chạy app trên máy local xem giao diện.
## Dùng H2 (in-memory) để không cần MySQL server.
## KHÔNG dùng cho production.

spring.datasource.url=jdbc:h2:mem:htqlt_dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dùng create-drop vì không có HT_QLDT.sql trong classpath dev.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
app.security.login.max-fail=1000
app.security.login.lock-minutes=1
app.storage.dir=${java.io.tmpdir}/htqlt-dev
