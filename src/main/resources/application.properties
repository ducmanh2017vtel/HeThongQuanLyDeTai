## =========================================================
##  Hệ thống quản lý đề tài sinh viên - khoa CNTT
##  Cấu hình mặc định (có thể override bằng biến môi trường
##  hoặc command-line: -D..., --spring.datasource.url=...)
## =========================================================

spring.application.name=hethong-quanlydetai

# --- Datasource (MySQL) -----------------------------------------------
# Biến môi trường ưu tiên; nếu không có thì dùng giá trị mặc định local dev.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hethong_quanlydetai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate -------------------------------------------------
# Schema do HT_QLDT.sql quản lý; KHÔNG để Hibernate tự sinh.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# --- Thymeleaf --------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# --- Server -----------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- Logging ----------------------------------------------------------
logging.level.root=INFO
logging.level.blog.hethong_quanlydetai=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# --- Hệ thống tùy chỉnh (đọc qua @Value) ------------------------------
# Thư mục lưu file báo cáo (ngoài static/); tạo nếu chưa có.
app.storage.dir=${APP_STORAGE_DIR:${user.home}/.hethong-quanlydetai/reports}
# Ngưỡng đạt (mặc định 5.00 theo giả định A4)
app.passing-score=${APP_PASSING_SCORE:5.00}
# Định dạng điểm hiển thị
app.score-scale-max=10
app.score-decimals=2
# Bảo mật: chặn IP sau N lần đăng nhập sai trong cửa sổ thời gian
app.security.login.max-fail=${APP_LOGIN_MAX_FAIL:5}
app.security.login.window-minutes=${APP_LOGIN_WINDOW_MINUTES:15}
app.security.login.lock-minutes=${APP_LOGIN_LOCK_MINUTES:15}
# Kích thước file tối đa cho báo cáo (mặc định 20MB theo A7)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --- Múi giờ máy chủ --------------------------------------------------
time.zone=Asia/Ho_Chi_Minh