## =========================================================
## Profile MySQL — kết nối tới MySQL Server thật (mặc định localhost:3306)
## Dùng khi cần dữ liệu bền vững, nhiều người dùng chung.
## Cần chạy schema docs/sql/HT_QLDT.sql + seed docs/seed/HT_QLDT_full.sql
## trước khi start app lần đầu.
## =========================================================

# Có thể override bằng biến môi trường: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hethong_quanlydetai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validate schema (do HT_QLDT.sql quản lý, KHÔNG cho Hibernate tự sinh)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.show-sql=false

# Tắt demo seed khi chạy MySQL (dùng file SQL thủ công)
app.demo.enabled=false

# Devtools (tự reload khi sửa class)
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# Mật khẩu tối đa thất bại (giảm để test nhanh)
app.security.login.max-fail=${APP_LOGIN_MAX_FAIL:5}
app.security.login.lock-minutes=${APP_LOGIN_LOCK_MINUTES:15}
