<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout.html :: head}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout.html :: sidebar}"></div>
    <div class="main">
        <div th:replace="~{fragments/layout.html :: topbar}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout.html :: flash}"></div>

            <div th:replace="~{fragments/layout.html :: page-header}"
                 th:with="pageTitle='Quản lý thông báo',
                          pageActions=${ { { 'label': '+ Tạo thông báo', 'link': '/notices/manage/new', 'style': 'btn-primary'} } }"></div>

            <section class="card">
                <table class="data-table" th:if="${not #lists.isEmpty(notices)}">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Tiêu đề</th>
                        <th>Loại</th>
                        <th>Trạng thái</th>
                        <th>Đăng bởi</th>
                        <th>Ngày tạo</th>
                        <th>Ngày công bố</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="n : ${notices}">
                        <td th:text="${n.id}">1</td>
                        <td><a th:href="@{|/notices/manage/${n.id}/edit|}" th:text="${n.title}">Tiêu đề</a></td>
                        <td><span class="tag tag-info" th:text="${n.type}">FACULTY</span></td>
                        <td><span th:replace="~{fragments/layout.html :: badge(${n.status.name()})}"></span></td>
                        <td th:text="${n.createdBy != null ? n.createdBy.fullName : 'N/A'}">N/A</td>
                        <td th:text="${#temporals.format(n.createdAt,'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${n.publishedAt != null ? #temporals.format(n.publishedAt,'dd/MM/yyyy HH:mm') : '—'}">—</td>
                        <td class="actions">
                            <a class="btn btn-sm btn-secondary" th:href="@{|/notices/${n.id}|}">Xem</a>
                            <a class="btn btn-sm btn-secondary" th:if="${n.status.name() != 'PUBLISHED'}"
                               th:href="@{|/notices/manage/${n.id}/edit|}">Sửa</a>
                            <form th:if="${n.status.name() == 'DRAFT'}"
                                  th:action="@{|/notices/manage/${n.id}/publish|}" method="post" class="inline-form">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-success">Công bố</button>
                            </form>
                            <form th:if="${n.status.name() == 'PUBLISHED'}"
                                  th:action="@{|/notices/manage/${n.id}/hide|}" method="post" class="inline-form">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-warning">Ẩn</button>
                            </form>
                            <form th:if="${n.status.name() != 'PUBLISHED'}"
                                  th:action="@{|/notices/manage/${n.id}/delete|}" method="post" class="inline-form"
                                  onsubmit="return confirm('Xoá thông báo này?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-danger">Xoá</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <p class="empty" th:if="${#lists.isEmpty(notices)}">Chưa có thông báo nào.</p>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout.html :: scripts}"></div>
</body>
</html>
