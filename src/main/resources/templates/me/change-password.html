<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout.html :: head}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout.html :: sidebar}"></div>
    <div class="main">
        <div th:replace="~{fragments/layout.html :: topbar}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout.html :: flash}"></div>
            <div th:replace="~{fragments/layout.html :: page-header}"
                 th:with="pageTitle='Đổi mật khẩu'"></div>

            <form class="card form-grid" method="post" th:action="@{/me/change-password}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-row">
                    <label class="label" for="oldPassword">Mật khẩu hiện tại *</label>
                    <input type="password" id="oldPassword" name="oldPassword" required>
                </div>
                <div class="form-row">
                    <label class="label" for="newPassword">Mật khẩu mới *</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="8" maxlength="128">
                    <span class="help">Tối thiểu 8 ký tự, có cả chữ và số.</span>
                </div>
                <div class="form-row">
                    <label class="label" for="confirmPassword">Xác nhận mật khẩu mới *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" maxlength="128">
                </div>
                <div class="form-actions">
                    <a class="btn btn-secondary" th:href="@{/me}">Hủy</a>
                    <button class="btn btn-primary" type="submit">Đổi mật khẩu</button>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout.html :: scripts}"></div>
</body>
</html>
