<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ================================================================
     fragments/layout.html
     Proxy fragments: head, scripts, sidebar, topbar, page-header, badge, pagination, flash
     KHÔNG tự include chính nó (tránh StackOverflowError).
     ================================================================ -->

<th:block th:fragment="head">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title th:text="${title != null ? title + ' · Quản lý đề tài' : 'Quản lý đề tài · Khoa CNTT'}">Quản lý đề tài · Khoa CNTT</title>
<link rel="stylesheet" th:href="@{/css/theme.css}">
<link rel="stylesheet" th:href="@{/css/layout.css}">
<link rel="stylesheet" th:href="@{/css/components.css}">
</th:block>

<th:block th:fragment="scripts">
<script th:src="@{/js/app.js}" defer></script>
</th:block>

<!-- sidebar proxy: include trực tiếp sidebar.html (KHÔNG tự include layout) -->
<th:block th:fragment="sidebar">
<th:block th:replace="~{fragments/sidebar :: sidebar(${active != null ? active : (activeMenu != null ? activeMenu : '')})}"></th:block>
</th:block>

<th:block th:fragment="topbar">
<header class="topbar">
<button type="button" class="topbar-toggle" aria-label="Mở menu">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
<line x1="3" y1="6" x2="21" y2="6"/>
<line x1="3" y1="12" x2="21" y2="12"/>
<line x1="3" y1="18" x2="21" y2="18"/>
</svg>
</button>
<nav class="topbar-breadcrumb" aria-label="Đường dẫn">
<a th:href="@{/dashboard}">Tổng quan</a>
</nav>
<div class="topbar-user">
<a th:href="@{/me}" class="topbar-user-link">
<span class="topbar-user-avatar" aria-hidden="true" sec:authentication="name">U</span>
<span class="txt" sec:authentication="name">Người dùng</span>
</a>
<a th:href="@{/me/change-password}" class="topbar-btn" title="Đổi mật khẩu">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
<span class="txt">Đổi MK</span>
</a>
<form th:action="@{/logout}" method="post" style="display:inline">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<button type="submit" class="topbar-btn">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
<span class="txt">Đăng xuất</span>
</button>
</form>
</div>
</header>
</th:block>

<th:block th:fragment="page-header">
<div class="page-header">
<div class="page-header-start">
<h1 class="page-title" th:text="${pageTitle != null ? pageTitle : 'Trang'}">Trang</h1>
<p class="page-subtitle" th:if="${pageSubtitle != null}" th:text="${pageSubtitle}"></p>
</div>
<th:block th:if="${pageActions != null and !#lists.isEmpty(pageActions)}">
<div class="page-header-end">
<th:block th:each="action,iter:${pageActions}">
<th:block th:if="${action.link != null}">
<a th:href="@{${action.link}}" class="btn btn-primary" th:text="${action.label}"></a>
</th:block>
<th:block th:if="${action.link == null}">
<a href="javascript:void(0)" class="btn btn-primary" th:text="${action.label}"></a>
</th:block>
</th:block>
</div>
</th:block>
</div>
</th:block>

<th:block th:fragment="badge(value)">
<span class="badge" th:class="'badge-' + ${value != null ? value.toLowerCase() : 'default'}" th:text="${value}"></span>
</th:block>

<th:block th:fragment="pagination(page, baseUrl)">
<th:block th:if="${page != null}">
<nav class="pagination-nav" aria-label="Phân trang">
<a th:if="${page.hasPrevious()}" th:href="@{${baseUrl}(page=${page.number - 1})}" class="btn btn-sm">← Trước</a>
<th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
<a th:href="@{${baseUrl}(page=${i})}" class="btn btn-sm" th:classappend="${i == page.number ? 'btn-primary' : ''}" th:text="${i + 1}"></a>
</th:block>
<a th:if="${page.hasNext()}" th:href="@{${baseUrl}(page=${page.number + 1})}" class="btn btn-sm">Sau →</a>
</nav>
</th:block>
</th:block>

<th:block th:fragment="flash">
<div class="flash-container" th:if="${success != null or error != null or message != null or info != null or flashSuccess != null or flashError != null or flashInfo != null}">
<div class="alert alert-success" role="status" data-auto-close="5000" th:if="${success != null}">
<span class="alert-icon" aria-hidden="true">✓</span>
<span class="alert-text" th:text="${success}"></span>
<button type="button" class="alert-close" aria-label="Đóng">×</button>
</div>
<div class="alert alert-success" role="status" data-auto-close="5000" th:if="${flashSuccess != null}">
<span class="alert-icon" aria-hidden="true">✓</span>
<span class="alert-text" th:text="${flashSuccess}"></span>
<button type="button" class="alert-close" aria-label="Đóng">×</button>
</div>
<div class="alert alert-error" role="alert" th:if="${error != null or flashError != null}">
<span class="alert-icon" aria-hidden="true">✗</span>
<span class="alert-text" th:text="${error != null ? error : flashError}"></span>
<button type="button" class="alert-close" aria-label="Đóng">×</button>
</div>
<div class="alert alert-info" role="status" data-auto-close="5000" th:if="${message != null or info != null or flashInfo != null}">
<span class="alert-icon" aria-hidden="true">ℹ</span>
<span class="alert-text" th:text="${message != null ? message : (info != null ? info : flashInfo)}"></span>
<button type="button" class="alert-close" aria-label="Đóng">×</button>
</div>
</div>
</th:block>

</html>
