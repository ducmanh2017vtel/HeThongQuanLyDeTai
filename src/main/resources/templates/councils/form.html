<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout.html :: head}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout.html :: sidebar}"></div>
    <div class="main">
        <div th:replace="~{fragments/layout.html :: topbar}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout.html :: flash}"></div>
            <div th:replace="~{fragments/layout.html :: page-header}"></div>

            <form class="card" method="post"
                  th:action="${council != null} ? @{/councils/{id}/edit(id=${council.id})} : @{/councils/new}"
                  th:object="${form}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-row">
                    <div class="form-group">
                        <label>Mã hội đồng <span class="required">*</span></label>
                        <input type="text" th:field="*{councilCode}" required maxlength="40"/>
                    </div>
                    <div class="form-group">
                        <label>Tên hội đồng <span class="required">*</span></label>
                        <input type="text" th:field="*{councilName}" required maxlength="180"/>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Đợt <span class="required">*</span></label>
                        <select th:field="*{periodId}" required>
                            <option value="">-- Chọn đợt --</option>
                            <option th:each="p : ${periods}" th:value="${p.id}" th:text="${p.name + ' (' + p.periodType + ')'}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ngày báo cáo (KLTN)</label>
                        <input type="datetime-local" th:field="*{reportDate}"/>
                    </div>
                </div>

                <h3>Thành viên hội đồng</h3>
                <p class="muted">1 Chủ tịch + 1 Thư ký + 1..3 Ủy viên. Tổng 3..5 người, không trùng.</p>
                <table class="table">
                    <thead>
                        <tr><th>Vai trò</th><th>Giảng viên</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="i : ${#numbers.sequence(0, 4)}">
                            <td>
                                <select th:field="*{roles[__${i}__]}" th:disabled="${i >= 5}">
                                    <option value="">—</option>
                                    <option value="CHAIRMAN" th:selected="${form.roles != null and i < form.roles.size() and form.roles[i] == 'CHAIRMAN'}">Chủ tịch</option>
                                    <option value="SECRETARY" th:selected="${form.roles != null and i < form.roles.size() and form.roles[i] == 'SECRETARY'}">Thư ký</option>
                                    <option value="MEMBER" th:selected="${form.roles != null and i < form.roles.size() and form.roles[i] == 'MEMBER'}">Ủy viên</option>
                                </select>
                            </td>
                            <td>
                                <select th:field="*{lecturerIds[__${i}__]}" th:disabled="${i >= 5}">
                                    <option value="">—</option>
                                    <option th:each="lec : ${lecturers}" th:value="${lec.id}"
                                            th:selected="${form.lecturerIds != null and i < form.lecturerIds.size() and form.lecturerIds[i] == lec.id}"
                                            th:text="${lec.user.fullName + ' (' + lec.lecturerCode + ')'}"></option>
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <h3>Đề tài được gán</h3>
                <p class="muted">Mỗi đề tài chỉ thuộc 1 hội đồng. Sau khi tạo hội đồng, vào màn chi tiết để gán đề tài (tính năng nâng cao, dùng API REST).</p>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Lưu</button>
                    <a class="btn" th:href="@{/councils}">Huỷ</a>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout.html :: scripts}"></div>
</body>
</html>
