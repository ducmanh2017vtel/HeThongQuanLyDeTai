<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="app-main">
    <div th:replace="~{fragments/layout :: topbar}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div th:replace="~{fragments/layout :: page-header(pageTitle='Duyệt nhóm đăng ký đề tài', pageSubtitle='Danh sách nhóm SV đăng ký đề tài do bạn hướng dẫn')}"></div>

    <form method="get" class="form-inline" style="margin-bottom:1rem">
        <select name="status">
            <option value="">Tất cả trạng thái</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                    th:selected="${status != null and status.name() == s.name()}"></option>
        </select>
        <button type="submit" class="btn">Lọc</button>
    </form>

    <table class="table">
        <thead>
            <tr>
                <th>Mã nhóm</th>
                <th>Tên nhóm</th>
                <th>Đề tài</th>
                <th>Đợt</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="g : ${page.content}">
                <td><strong th:text="${g.groupCode}"></strong></td>
                <td th:text="${g.groupName}"></td>
                <td>
                    <span th:if="${g.topic != null}">
                        <strong th:text="${g.topic.topicCode}"></strong><br/>
                        <small th:text="${g.topic.topicName}"></small>
                    </span>
                </td>
                <td th:text="${g.period.name}"></td>
                <td><span th:replace="~{fragments/layout :: badge(${g.status.toString()})}"></span></td>
                <td>
                    <a th:href="@{|/registrations-approval/${g.id}|}" class="btn btn-sm">Xem</a>
                </td>
            </tr>
            <tr th:if="${page.totalElements == 0}">
                <td colspan="6" class="empty-state">Chưa có nhóm nào đăng ký đề tài do bạn hướng dẫn.</td>
            </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/layout :: pagination(${page}, '/registrations')}"></div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
