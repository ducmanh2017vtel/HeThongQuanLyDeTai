<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout.html :: head}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout.html :: sidebar}"></div>
    <div class="main">
        <div th:replace="~{fragments/layout.html :: topbar}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout.html :: flash}"></div>
            <div th:replace="~{fragments/layout.html :: page-header}"
                 th:with="pageTitle='Quản lý vai trò',
                          pageActions=${ { {label:'+ Tạo vai trò', link:'/admin/roles/new'} } }"></div>

            <div class="table-wrap card">
                <table class="data-table" th:if="${not #lists.isEmpty(roles)}">
                    <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Tên</th>
                        <th>Mô tả</th>
                        <th>Loại</th>
                        <th>Số quyền</th>
                        <th class="actions">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${roles}">
                        <td><strong th:text="${r.code}"></strong></td>
                        <td th:text="${r.name}"></td>
                        <td th:text="${r.description}"></td>
                        <td>
                            <span th:if="${r.systemFlag}" class="badge badge-info">Hệ thống</span>
                            <span th:unless="${r.systemFlag}" class="badge badge-neutral">Tuỳ biến</span>
                        </td>
                        <td th:text="${#sets.size(r.permissions)}"></td>
                        <td class="actions">
                            <a class="btn btn-ghost" th:href="@{|/admin/roles/${r.id}/edit|}">Sửa</a>
                            <a class="btn btn-ghost" th:href="@{|/admin/permissions/assign/${r.id}|}">Phân quyền</a>
                            <form th:unless="${r.systemFlag}" th:action="@{|/admin/roles/${r.id}/delete|}"
                                  method="post" class="inline"
                                  data-confirm="Xóa vai trò này?">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-ghost" type="submit">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout.html :: scripts}"></div>
</body>
</html>
