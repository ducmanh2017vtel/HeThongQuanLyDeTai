<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout.html :: head}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout.html :: sidebar}"></div>
    <div class="main">
        <div th:replace="~{fragments/layout.html :: topbar}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout.html :: flash}"></div>
            <div th:replace="~{fragments/layout.html :: page-header}"
                 th:with="pageTitle='Quản lý tài khoản',
                          pageSubtitle='Tạo, sửa, khóa/mở khóa, đặt lại mật khẩu',
                          pageActions=${ { {label:'+ Tạo tài khoản', link:'/admin/users/new'} } }"></div>

            <!-- Bộ lọc -->
            <form class="filter-bar" method="get" th:action="@{/admin/users}">
                <label class="form-row">
                    <span class="label">Tìm kiếm</span>
                    <input type="text" name="q" th:value="${q}" placeholder="Tên đăng nhập / họ tên / email">
                </label>
                <label class="form-row">
                    <span class="label">Vai trò</span>
                    <select name="roleId">
                        <option value="">-- Tất cả --</option>
                        <option th:each="r : ${allRoles}" th:value="${r.id}"
                                th:text="${r.name}" th:selected="${r.id == roleId}"></option>
                    </select>
                </label>
                <label class="form-row">
                    <span class="label">Trạng thái</span>
                    <select name="status">
                        <option value="">-- Tất cả --</option>
                        <option value="ACTIVE" th:selected="${status=='ACTIVE'}">Hoạt động</option>
                        <option value="LOCKED" th:selected="${status=='LOCKED'}">Bị khóa</option>
                    </select>
                </label>
                <button class="btn btn-secondary" type="submit">Lọc</button>
            </form>

            <div class="table-wrap card">
                <table class="data-table" th:if="${not #lists.isEmpty(page.content)}">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Tên đăng nhập</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>Vai trò</th>
                        <th>Trạng thái</th>
                        <th class="actions">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u,iter : ${page.content}">
                        <td th:text="${page.number * page.size + iter.count}"></td>
                        <td th:text="${u.username}"></td>
                        <td th:text="${u.fullName}"></td>
                        <td th:text="${u.email}"></td>
                        <td>
                            <span class="tag tag-info"
                                  th:each="r : ${u.roles}" th:text="${r.code}"></span>
                        </td>
                        <td th:replace="~{fragments/layout.html :: badge(${u.status.name()})}"></td>
                        <td class="actions">
                            <a class="btn btn-ghost" th:href="@{|/admin/users/${u.id}/edit|}">Sửa</a>
                            <form th:action="@{|/admin/users/${u.id}/reset-password|}" method="post" class="inline"
                                  data-confirm="Đặt lại mật khẩu cho tài khoản này?">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-ghost" type="submit">Đặt lại MK</button>
                            </form>
                            <form th:if="${u.status.name()=='ACTIVE'}"
                                  th:action="@{|/admin/users/${u.id}/lock|}" method="post" class="inline"
                                  data-confirm="Khóa tài khoản này?">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-ghost" type="submit">Khóa</button>
                            </form>
                            <form th:if="${u.status.name()=='LOCKED'}"
                                  th:action="@{|/admin/users/${u.id}/unlock|}" method="post" class="inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-ghost" type="submit">Mở khóa</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <p class="empty" th:if="${#lists.isEmpty(page.content)}">
                    Chưa có tài khoản nào phù hợp. Bấm "+ Tạo tài khoản" để bắt đầu.
                </p>
            </div>

            <div th:replace="~{fragments/layout.html :: pagination(${page}, '/admin/users')}"></div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout.html :: scripts}"></div>
</body>
</html>
