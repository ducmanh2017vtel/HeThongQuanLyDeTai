<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout.html :: head}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/layout.html :: sidebar}"></div>
    <div class="main">
        <div th:replace="~{fragments/layout.html :: topbar}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout.html :: flash}"></div>
            <div th:replace="~{fragments/layout.html :: page-header}"></div>

            <form class="card" method="post" th:action="@{/evaluations/{id}(id=${assignmentId})}" th:object="${form}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="score">Điểm (0–10, làm tròn 2 chữ số) <span class="required">*</span></label>
                    <input type="number" step="0.01" min="0" max="10" th:field="*{score}" id="score" required/>
                </div>

                <div class="form-group">
                    <label for="comment">Nhận xét <span class="required">*</span></label>
                    <textarea th:field="*{comment}" id="comment" rows="6" minlength="10" maxlength="2000" required></textarea>
                    <small class="muted">Tối thiểu 10 ký tự.</small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Nộp điểm</button>
                    <a class="btn" th:href="@{/evaluations}">Huỷ</a>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout.html :: scripts}"></div>
</body>
</html>
