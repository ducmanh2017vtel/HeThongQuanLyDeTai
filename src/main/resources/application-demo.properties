## =========================================================
##  Profile demo (kích hoạt bằng --spring.profiles.active=demo
##  hoặc SPRING_PROFILES_ACTIVE=demo).
##  Tự động nạp thêm dữ liệu mẫu để dễ thử.
##  CHỈ DÙNG CHO DEMO. KHÔNG BẬT Ở MÔI TRƯỜNG THẬT.
## =========================================================

# Tự động nạp dữ liệu mẫu sau khi schema đã sẵn sàng
app.demo.enabled=true
# Đường dẫn file seed (đặt ở docs/seed/HT_QLDT_demo.sql)
app.demo.seed-path=classpath:db/seed/HT_QLDT_demo.sql
# Mật khẩu mặc định cho tài khoản demo (BCrypt-hash sẽ được dùng)
app.demo.default-password=Demo@123