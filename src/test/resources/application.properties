## =========================================================
##  Profile TEST (chỉ dùng khi @ActiveProfiles("test"))
##  - Khởi tạo schema bằng Hibernate (ddl-auto=create-drop)
##  - Dùng H2 ở chế độ tương thích MySQL
##  - Có sẵn 1 user admin (username=admin, password=admin) cho mục đích test
## =========================================================

spring.datasource.url=jdbc:h2:mem:htqlt_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Tắt các phần không cần trong test
spring.thymeleaf.cache=false
app.security.login.max-fail=1000
app.security.login.lock-minutes=1
# Không cần tạo thư mục báo cáo trong test
app.storage.dir=${java.io.tmpdir}/htqlt-test